version: "3.9"

services:
  db:
    image: postgres:16-bookworm
    container_name: kinobot_postgres
    environment:
      POSTGRES_DB: kinobot_db
      POSTGRES_USER: kinobot_admin
      POSTGRES_PASSWORD: kinobot_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped
  bot:
    build: .
    container_name: kino_bot
    depends_on:
      - db
    
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pg_data:
