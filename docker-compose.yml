version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kinobot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinobot_db}
      POSTGRES_USER: ${POSTGRES_USER:-kinobot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinobot_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinobot_admin} -d ${POSTGRES_DB:-kinobot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kinobot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  bot:
    build: .
    container_name: kino_bot
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    container_name: kinobot_worker
    command: python worker.py
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
